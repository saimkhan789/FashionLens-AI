<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FashionLens mobile: Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&amp;family=DM+Sans:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1a1a1a;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #fafaf8; color: #1a1a1a; font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.5">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 8px">
    <span style="font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600">FashionLens <span style="color: {{accent}}">AI</span></span>
    <a href="#" style="padding: 8px 14px; border-radius: 999px; background: #1a1a1a; color: #ffffff; font-size: 13px">Sign in</a>
  </header>

  <div style="padding: 10px 20px 0">
    <h1 style="margin: 0; font-family: 'Playfair Display', serif; font-size: 34px; line-height: 1.08; font-weight: 700">Saw it on<br>Pinterest? <span style="font-style: italic; font-weight: 500; color: {{accent}}">Find it.</span></h1>

    <button type="button" style="margin-top: 20px; width: 100%; height: 168px; border: 0; border-radius: 22px; padding: 20px; text-align: left; color: #ffffff; background: linear-gradient(150deg, #d8774f, #8a3b22); box-shadow: 0 24px 40px -18px rgba(168,64,30,0.65); display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; font: inherit">
      <span style="width: 48px; height: 48px; border-radius: 14px; background: rgba(255,255,255,0.18); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: grid; place-items: center">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.6l1.4-2h7l1.4 2h1.6A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      </span>
      <span>
        <span style="display: block; font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 600">Search with a photo</span>
        <span style="display: block; font-size: 13px; opacity: 0.9">Gallery, camera or a screenshot</span>
      </span>
    </button>

    <form style="margin-top: 14px; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-radius: 16px; background: #ffffff; border: 1px solid #e8e8e4; box-shadow: 0 10px 24px -14px rgba(26,26,26,0.25)">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#6b6b64" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label for="q-m" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search</label>
      <input id="q-m" placeholder="Describe it, or paste a link" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit">
    </form>
    <p style="margin: 8px 4px 0; font-size: 12px; color: #6b6b64">3 free searches and 1 photo search left</p>

    <p style="margin: 22px 0 10px; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #6b6b64">Try</p>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <a href="#" style="padding: 8px 13px; border-radius: 999px; background: #ffffff; border: 1px solid #e8e8e4; font-size: 13px">black kurta</a>
      <a href="#" style="padding: 8px 13px; border-radius: 999px; background: #ffffff; border: 1px solid #e8e8e4; font-size: 13px">lawn under 5k</a>
      <a href="#" style="padding: 8px 13px; border-radius: 999px; background: #ffffff; border: 1px solid #e8e8e4; font-size: 13px">wedding wear</a>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 24px 0 10px">
      <h2 style="margin: 0; font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600">New this week</h2>
      <a href="#" style="font-size: 13px; color: #6b6b64">See all</a>
    </div>
    <div style="display: flex; gap: 12px">
      <div style="flex: 0 0 132px; height: 170px; border-radius: 16px; background: linear-gradient(160deg, #ecdccf, #c39c86); box-shadow: 0 14px 26px -16px rgba(26,26,26,0.4)"></div>
      <div style="flex: 0 0 132px; height: 170px; border-radius: 16px; background: linear-gradient(160deg, #e4e8df, #a9b6a4); box-shadow: 0 14px 26px -16px rgba(26,26,26,0.4)"></div>
      <div style="flex: 0 0 132px; height: 170px; border-radius: 16px; background: linear-gradient(160deg, #f1e7d5, #cdb68e); box-shadow: 0 14px 26px -16px rgba(26,26,26,0.4)"></div>
    </div>
  </div>

  <nav style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 66px; border-radius: 22px; background: rgba(255,255,255,0.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(232,232,228,0.9); box-shadow: 0 20px 40px -16px rgba(26,26,26,0.35); display: flex; justify-content: space-around; align-items: center">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: {{accent}}; padding: 6px 12px">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Search</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #6b6b64; padding: 6px 12px">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.1a4.3 4.3 0 0 1 7.5 2.7C19.5 15.4 12 20 12 20z"></path></svg>Saved</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #6b6b64; padding: 6px 12px">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>History</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: #6b6b64; padding: 6px 12px">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>Account</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c8502a","options":["#c8502a","#1a1a1a","#7a5c3e"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#c8502a' };
  }
}
</script>
</body>
</html>
