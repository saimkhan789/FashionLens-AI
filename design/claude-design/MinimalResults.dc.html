<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FashionLens Minimal: Photo search results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111111;text-decoration:none}a:hover{color:#52525b}
</style>
</helmet>
<div style="min-height: 1180px; background: #ffffff; color: #111111; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.55">

  <header style="border-bottom: 1px solid #e4e4e7">
    <nav style="max-width: 1280px; margin: 0 auto; padding: 0 32px; height: 60px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap">
      <a href="#" style="display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; letter-spacing: -0.02em">
        <span style="width: 22px; height: 22px; border-radius: 6px; background: {{accent}}; display: grid; place-items: center"><span style="width: 8px; height: 8px; border-radius: 999px; border: 2px solid #ffffff"></span></span>
        FashionLens
      </a>
      <form style="flex: 1 1 360px; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 4px 0 12px; border: 1px solid #d4d4d8; border-radius: 8px">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <label for="q-br" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search</label>
        <input id="q-br" placeholder="Search again" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 14px">
        <button type="button" aria-label="Search with a photo" style="width: 44px; height: 32px; border: 0; border-radius: 6px; background: #f4f4f5; display: grid; place-items: center; cursor: pointer">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.6l1.4-2h7l1.4 2h1.6A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        </button>
      </form>
      <div style="display: flex; gap: 20px; font-size: 14px; flex-wrap: wrap">
        <a href="#" style="color: #52525b">Saved</a>
        <a href="#" style="color: #52525b">History</a>
        <a href="#" style="width: 32px; height: 32px; border-radius: 999px; background: #f4f4f5; display: grid; place-items: center; font-weight: 600; font-size: 13px">S</a>
      </div>
    </nav>
  </header>

  <div style="border-bottom: 1px solid #e4e4e7; background: #fafafa">
    <div style="max-width: 1280px; margin: 0 auto; padding: 16px 32px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
      <div style="position: relative; width: 72px; height: 96px; border-radius: 8px; overflow: hidden; background: #d6d3d1; flex-shrink: 0">
        <div style="position: absolute; left: 20%; top: 18%; width: 60%; height: 40%; border: 2px solid {{accent}}; border-radius: 4px"></div>
      </div>
      <div style="min-width: 0">
        <p style="margin: 0 0 8px; font-size: 13px; color: #52525b">3 pieces found in your photo. Pick one to match.</p>
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <button type="button" style="padding: 6px 12px; border: 1px solid {{accent}}; border-radius: 8px; background: {{accent}}; color: #ffffff; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Kurta · 24+</button>
          <button type="button" style="padding: 6px 12px; border: 1px solid #d4d4d8; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; cursor: pointer">Trousers</button>
          <button type="button" style="padding: 6px 12px; border: 1px solid #d4d4d8; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; cursor: pointer">Dupatta</button>
          <button type="button" style="padding: 6px 12px; border: 1px solid #d4d4d8; border-radius: 8px; background: #ffffff; font: inherit; font-size: 13px; cursor: pointer">Full look</button>
        </div>
      </div>
    </div>
  </div>

  <main style="max-width: 1280px; margin: 0 auto; padding: 24px 32px 64px; display: flex; flex-wrap: wrap; gap: 32px">
    <aside style="flex: 1 1 200px; max-width: 220px; min-width: 0; font-size: 14px">
      <p style="margin: 0 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #71717a">Brand</p>
      <label style="display: flex; align-items: center; gap: 8px; padding: 4px 0"><input type="checkbox" checked> Limelight</label>
      <label style="display: flex; align-items: center; gap: 8px; padding: 4px 0"><input type="checkbox"> [Brand]</label>
      <label style="display: flex; align-items: center; gap: 8px; padding: 4px 0"><input type="checkbox"> [Brand]</label>

      <p style="margin: 22px 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #71717a">For</p>
      <label style="display: flex; align-items: center; gap: 8px; padding: 4px 0"><input type="radio" name="g" checked> Women</label>
      <label style="display: flex; align-items: center; gap: 8px; padding: 4px 0"><input type="radio" name="g"> Men</label>
      <label style="display: flex; align-items: center; gap: 8px; padding: 4px 0"><input type="radio" name="g"> Kids</label>

      <p style="margin: 22px 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #71717a">Price (Rs)</p>
      <div style="display: flex; gap: 8px">
        <label for="min-b" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Minimum price</label>
        <input id="min-b" placeholder="Min" style="width: 100%; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid #d4d4d8; border-radius: 6px; font: inherit; font-size: 13px">
        <label for="max-b" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Maximum price</label>
        <input id="max-b" placeholder="Max" style="width: 100%; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid #d4d4d8; border-radius: 6px; font: inherit; font-size: 13px">
      </div>
      <button type="button" style="margin-top: 22px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 13px; color: #52525b; text-decoration: underline; cursor: pointer">Clear filters</button>
    </aside>

    <section style="flex: 999 1 560px; min-width: 0">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap">
        <h1 style="margin: 0; font-size: 18px; font-weight: 600">Matches for the kurta</h1>
        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #52525b">Sort
          <select style="height: 34px; padding: 0 8px; border: 1px solid #d4d4d8; border-radius: 6px; background: #ffffff; font: inherit; font-size: 13px">
            <option>Best match</option><option>Price: low to high</option><option>Price: high to low</option>
          </select>
        </label>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px 16px">
        <sc-for list="{{products}}" as="p" hint-placeholder-count="8">
          <article style="position: relative">
            <a href="#" style="display: block">
              <div style="aspect-ratio: 3 / 4; border-radius: 8px; background: {{p.tone}}"></div>
              <p style="margin: 8px 0 0; font-size: 13px; color: #71717a">{{p.brand}}</p>
              <h3 style="margin: 0; font-size: 14px; font-weight: 400; line-height: 1.35">[Product name from the brand]</h3>
              <p style="margin: 2px 0 0; font-size: 14px; font-weight: 600">Rs [price]</p>
            </a>
            <button type="button" aria-label="Save" style="position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border: 0; border-radius: 8px; background: rgba(255,255,255,0.9); display: grid; place-items: center; cursor: pointer">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#3f3f46" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.1a4.3 4.3 0 0 1 7.5 2.7C19.5 15.4 12 20 12 20z"></path></svg>
            </button>
            <a href="#" style="display: inline-block; margin-top: 4px; font-size: 12px; color: #52525b; text-decoration: underline">Similar</a>
          </article>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#111111","options":["#111111","#c8502a","#1d4ed8"]},"$preview":{"width":1280,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const tones = ['#e7e5e4', '#e4e4e7', '#ececea', '#e5e7eb', '#eae8e6', '#e6e6e9', '#e8e6e3', '#e3e5e8'];
    return {
      accent: this.props.accent ?? '#111111',
      products: tones.map((tone, i) => ({ tone, brand: i % 3 === 0 ? 'Limelight' : '[Brand]' }))
    };
  }
}
</script>
</body>
</html>
